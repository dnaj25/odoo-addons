<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dana Alajmi | Socials</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            /* خلفية متدرجة حديثة وممتازة للتوسيط */
            background: radial-gradient(circle at top left, #e0e7ff 0%, #f8fafc 40%, #fae8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        /* كارت الواجهة الرئيسي */
        .social-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 28px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.05), 
                0 20px 25px -5px rgba(15, 23, 42, 0.08),
                inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.8);
            text-align: center;
            transition: transform 0.3s ease;
            margin: 0 auto !important;
        }
        /* صورة بروفايل أو أيقونة علوية ممتازة */
        .profile-avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.25);
            border: 2.5px solid #c084fc;
            overflow: hidden;
            background: #090810;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }
        .social-card h2 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .social-card .subtitle {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 28px;
        }
        /* قائمة الأزرار */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 54px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
        }
        /* تأثيرات التحويم العامة لمنع الخط السفلي */
        .social-btn:hover {
            transform: translateY(-2px);
            text-decoration: none !important;
        }
        .social-btn:focus,
        .social-btn:active {
            transform: translateY(0);
            text-decoration: none !important;
        }
        /* زر الواتساب */
        .btn-whatsapp {
            background: #25D366;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
        }
        .btn-whatsapp:hover {
            background: #20bd5a;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
        }

        /* زر الجيت هب */
        .btn-github {
            background: #181717;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(24, 23, 23, 0.2);
        }
        .btn-github:hover {
            background: #0d0d0d;
            box-shadow: 0 8px 20px rgba(24, 23, 23, 0.35);
        }

        /* زر لينكدان */
        .btn-linkedin {
            background: #0A66C2;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.25);
        }
        .btn-linkedin:hover {
            background: #08529c;
            box-shadow: 0 8px 20px rgba(10, 102, 194, 0.35);
        }

        /* زر البريد الإلكتروني */
        .btn-email {
            background: #64748b;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.2);
        }
        .btn-email:hover {
            background: #475569;
            box-shadow: 0 8px 20px rgba(100, 116, 139, 0.3);
        }

        .social-btn i {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="social-card">
        <div class="profile-avatar">
            <img src="https://raw.githubusercontent.com/dnaj25/odoo-addons/19.0/dana_logo.jpg" alt="Dana Alajmi Logo">
        </div>
        <h2>My Socials</h2>
        <p class="subtitle">Connect with me across platforms</p>
        <div class="social-links">
            <a href="https://wa.me/966544297579" target="_blank" class="social-btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                WhatsApp
            </a>
            
            <a href="https://github.com/dnaj25" target="_blank" class="social-btn btn-github">
                <i class="fa-brands fa-github"></i>
                GitHub
            </a>
            
            <a href="https://linkedin.com/in/dana-alajmi-03a03725b" target="_blank" class="social-btn btn-linkedin">
                <i class="fa-brands fa-linkedin-in"></i>
                LinkedIn
            </a>
            
            <a href="mailto:alajmidana18@gmail.com" class="social-btn btn-email">
                <i class="fa-solid fa-envelope"></i>
                Email Me
            </a>
        </div> 
    </div>
</body>
</html>
